<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0002">
<meta name="description" content="RΞD Access — Telegram community">
<title>RΞD · Exclusive Access</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0a0002;
    --card: rgba(10,0,2,.72);
    --red: #ff003c;
    --pink: #ff4d6d;
    --text: #fff;
    --muted: rgba(255,255,255,.5);
    --faint: rgba(255,255,255,.16);
    --border: rgba(255,0,60,.18);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    -webkit-font-smoothing: antialiased;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, Arial, sans-serif;
}

.glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
}

.glow.one {
    width: 500px;
    height: 500px;
    background: var(--red);
    top: -250px;
    right: -150px;
    opacity: .12;
    animation: float1 18s ease-in-out infinite alternate;
}

.glow.two {
    width: 450px;
    height: 450px;
    background: #cc0033;
    bottom: -230px;
    left: -160px;
    opacity: .1;
    animation: float2 20s ease-in-out infinite alternate;
}

.glow.three {
    width: 300px;
    height: 300px;
    background: var(--pink);
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    opacity: .04;
    animation: pulse 8s ease-in-out infinite;
}

@keyframes float1 {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(60px,-40px) scale(1.3); }
}

@keyframes float2 {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(-50px,30px) scale(1.25); }
}

@keyframes pulse {
    0%,100% {
        transform: translate(-50%,-50%) scale(1);
        opacity: .04;
    }
    50% {
        transform: translate(-50%,-50%) scale(1.25);
        opacity: .08;
    }
}

.card {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 440px;
    padding: 42px 28px 34px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 42px;
    backdrop-filter: blur(35px);
    -webkit-backdrop-filter: blur(35px);
    box-shadow:
        0 40px 120px rgba(0,0,0,.85),
        inset 0 0 0 1px rgba(255,0,60,.04);
    animation: borderPulse 3s infinite alternate;
}

@keyframes borderPulse {
    from { border-color: rgba(255,0,60,.12); }
    to { border-color: rgba(255,0,60,.35); }
}

.live {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 7px 15px 7px 11px;
    margin-bottom: 22px;
    border: 1px solid rgba(255,0,60,.12);
    border-radius: 50px;
    background: rgba(255,0,60,.06);
}

.live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 15px var(--red);
    animation: dot 1.2s infinite;
}

@keyframes dot {
    50% {
        opacity: .25;
        transform: scale(.7);
    }
}

.live span {
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
}

.live-count {
    color: var(--pink) !important;
    background: rgba(255,0,60,.1);
    padding: 3px 10px;
    border-radius: 20px;
}

h1 {
    font-size: 2.6rem;
    line-height: 1.05;
    letter-spacing: -.04em;
    margin-bottom: 6px;
}

.gradient {
    background: linear-gradient(135deg,#ff4d6d,#cc0033);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.subtitle {
    color: rgba(255,255,255,.3);
    font-size: .9rem;
    letter-spacing: .04em;
    margin-bottom: 30px;
}

.timer {
    margin-bottom: 25px;
}

.timer-display {
    font-size: 3.8rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
    margin-bottom: 13px;
    transition: .3s;
}

.warning {
    color: var(--pink);
    text-shadow: 0 0 30px rgba(255,77,109,.3);
}

.urgent {
    color: var(--red);
    text-shadow: 0 0 40px rgba(255,0,60,.5);
    animation: urgent .7s infinite;
}

@keyframes urgent {
    50% { opacity: .35; }
}

.progress {
    height: 3px;
    width: 100%;
    overflow: hidden;
    background: rgba(255,255,255,.04);
    border-radius: 10px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#ff003c,#ff4d6d);
    border-radius: inherit;
    box-shadow: 0 0 25px rgba(255,0,60,.4);
    transition: width .4s ease;
}

.ticker {
    height: 28px;
    width: 100%;
    overflow: hidden;
    margin-bottom: 20px;
    border: 1px solid rgba(255,0,60,.08);
    border-radius: 50px;
    background: rgba(255,0,60,.03);
}

.ticker-track {
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: ticker 12s linear infinite;
}

.ticker-item {
    height: 28px;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    color: rgba(255,255,255,.3);
    font-size: .72rem;
}

.username {
    color: var(--pink);
    font-weight: 600;
}

.time {
    color: var(--red);
    font-size: .65rem;
}

@keyframes ticker {
    from { transform: translateY(0); }
    to { transform: translateY(-50%); }
}

.telegram {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 17px;
    margin-bottom: 18px;
    text-decoration: none;
    text-align: left;
    border: 1px solid rgba(255,0,60,.08);
    border-radius: 24px;
    background: rgba(255,0,60,.04);
    transition: .3s;
}

.telegram:hover {
    border-color: rgba(255,0,60,.25);
    background: rgba(255,0,60,.07);
}

.telegram-icon {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    background: linear-gradient(135deg,#1a7feb,#0b5fbb);
    color: white;
    font-size: 19px;
}

.telegram-info {
    flex: 1;
    min-width: 0;
}

.telegram-name {
    color: white;
    font-size: .85rem;
    font-weight: 700;
    margin-bottom: 3px;
}

.telegram-meta {
    color: rgba(255,255,255,.3);
    font-size: .7rem;
}

.arrow {
    color: rgba(255,255,255,.2);
    font-size: 1.3rem;
}

.btn-wrap {
    position: relative;
}

.btn-glow {
    position: absolute;
    inset: 0;
    background: var(--red);
    filter: blur(35px);
    opacity: .12;
    border-radius: 40px;
    animation: btnGlow 2s infinite;
}

@keyframes btnGlow {
    50% {
        transform: scale(1.06);
        opacity: .25;
    }
}

.join {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 13px;
    padding: 18px 22px;
    border: 0;
    border-radius: 40px;
    background: var(--red);
    color: white;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 40px rgba(255,0,60,.3);
    transition: .3s;
}

.join:hover {
    transform: translateY(-2px) scale(1.02);
    background: #ff1a4a;
    box-shadow: 0 14px 55px rgba(255,0,60,.5);
}

.join:active {
    transform: scale(.97);
}

.join.disabled {
    opacity: .4;
    pointer-events: none;
    box-shadow: none;
}

.footer {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
    margin-top: 22px;
    padding-top: 19px;
    border-top: 1px solid rgba(255,0,60,.08);
}

.footer span {
    color: rgba(255,255,255,.18);
    font-size: .6rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
}

.footer strong {
    color: rgba(255,255,255,.4);
}

@media (max-width: 440px) {
    body {
        padding: 14px;
    }

    .card {
        padding: 32px 18px 28px;
        border-radius: 36px;
    }

    h1 {
        font-size: 2.2rem;
    }

    .timer-display {
        font-size: 3rem;
    }

    .join {
        padding: 16px 20px;
        font-size: 1rem;
    }
}

@media (max-width: 360px) {
    .card {
        padding: 25px 14px;
    }

    h1 {
        font-size: 1.9rem;
    }

    .timer-display {
        font-size: 2.4rem;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>
<div class="glow three"></div>

<main class="card">

    <div class="live">
        <span class="live-dot"></span>
        <span>Live</span>
        <span class="live-count" id="liveCount">89</span>
        <span>joined</span>
    </div>

    <h1>
        <span class="gradient">RΞD</span> Access
    </h1>

    <p class="subtitle">
        Invite-only · 24h window
    </p>

    <section class="timer">
        <div
            class="timer-display"
            id="timer"
            role="timer"
            aria-live="off">
            10:00
        </div>

        <div class="progress">
            <div
                class="progress-fill"
                id="progress">
            </div>
        </div>
    </section>

    <div class="ticker">
        <div class="ticker-track" id="ticker"></div>
    </div>

    <a
        href="https://t.me/NseSnehaTiwariBoT?start=ref_8753914631"
        class="telegram"
        target="_blank"
        rel="noopener noreferrer">

        <div class="telegram-icon">✈</div>

        <div class="telegram-info">
            <div class="telegram-name">
                RΞD · Exclusive
            </div>

            <div class="telegram-meta">
                <span id="members">1,284</span>
                members · Active now
            </div>
        </div>

        <div class="arrow">›</div>
    </a>

    <div class="btn-wrap">
        <div class="btn-glow"></div>

        <a
            href="https://t.me/+fB39naJwgfEzOWU1"
            class="join"
            id="joinBtn"
            target="_blank"
            rel="noopener noreferrer">

            <span id="joinText">Enter Telegram</span>
            <span>⟶</span>

        </a>
    </div>

    <footer class="footer">
        <span>🔒 <strong>256</strong>-bit</span>
        <span>⚡ <strong>0%</strong>-latency</span>
        <span>📱 Android & iOS ready</span>
    </footer>

</main>

<script>
(function () {
    "use strict";

    const CONFIG = {
        TELEGRAM_URL: "https://t.me/+fB39naJwgfEzOWU1",
        DURATION: 10 * 60 * 1000,
        STORAGE_KEY: "red_access_end_time_v3"
    };

    const timerEl = document.getElementById("timer");
    const progressEl = document.getElementById("progress");
    const joinBtn = document.getElementById("joinBtn");
    const joinText = document.getElementById("joinText");
    const tickerEl = document.getElementById("ticker");
    const liveCountEl = document.getElementById("liveCount");
    const membersEl = document.getElementById("members");

    let endTime = null;
    let expired = false;

    const usernames = [
        "0x_red",
        "crimson_byte",
        "neon_ghost",
        "shadow_ops",
        "volt_agent",
        "inferno_core",
        "cyber_pulse",
        "red_queen",
        "delta_fire",
        "omega_rx",
        "phoenix_zk",
        "rage_frame",
        "synth_wave",
        "void_runner",
        "blaze_hash",
        "night_cipher",
        "solar_drift",
        "quantum_rx",
        "ghost_proto",
        "redline_ops"
    ];

    function getEndTime() {
        try {
            const saved = localStorage.getItem(CONFIG.STORAGE_KEY);

            if (saved) {
                const value = Number(saved);

                if (
                    Number.isFinite(value) &&
                    value > Date.now()
                ) {
                    return value;
                }
            }
        } catch (error) {
            console.warn("Storage unavailable:", error);
        }

        const newEndTime = Date.now() + CONFIG.DURATION;

        try {
            localStorage.setItem(
                CONFIG.STORAGE_KEY,
                String(newEndTime)
            );
        } catch (error) {
            console.warn("Could not save timer:", error);
        }

        return newEndTime;
    }

    function formatTime(ms) {
        const totalSeconds = Math.max(
            0,
            Math.ceil(ms / 1000)
        );

        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        return (
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0")
        );
    }

    function updateTimer() {
        if (expired) return;

        const remaining = endTime - Date.now();

        if (remaining <= 0) {
            expire();
            return;
        }

        timerEl.textContent = formatTime(remaining);

        timerEl.classList.remove(
            "warning",
            "urgent"
        );

        if (remaining <= 60 * 1000) {
            timerEl.classList.add("urgent");
        } else if (remaining <= 180 * 1000) {
            timerEl.classList.add("warning");
        }

        const elapsed =
            CONFIG.DURATION - remaining;

        const percentage =
            Math.min(
                100,
                Math.max(
                    0,
                    (elapsed / CONFIG.DURATION) * 100
                )
            );

        progressEl.style.width =
            percentage + "%";
    }

    function expire() {
        if (expired) return;

        expired = true;

        timerEl.textContent = "00:00";
        timerEl.classList.remove("warning");
        timerEl.classList.add("urgent");

        progressEl.style.width = "100%";

        joinBtn.classList.add("disabled");
        joinBtn.removeAttribute("href");
        joinBtn.removeAttribute("target");
        joinBtn.removeAttribute("rel");

        joinText.textContent =
            "Session Expired";

        try {
            localStorage.removeItem(
                CONFIG.STORAGE_KEY
            );
        } catch (error) {}
    }

    function generateTicker() {
        let html = "";

        const items = [];

        for (let i = 0; i < 20; i++) {
            const name =
                usernames[
                    Math.floor(
                        Math.random() *
                        usernames.length
                    )
                ];

            const minutes =
                Math.floor(
                    Math.random() * 12
                ) + 1;

            const seconds =
                Math.floor(
                    Math.random() * 60
                );

            items.push(`
                <div class="ticker-item">
                    <span class="username">${name}</span>
                    <span>joined ·</span>
                    <span class="time">
                        ${minutes}m ${seconds}s ago
                    </span>
                </div>
            `);
        }

        html = items.join("") + items.join("");

        tickerEl.innerHTML = html;
    }

    function updateLiveCount() {
        const change =
            Math.floor(Math.random() * 3) + 1;

        let current =
            Number(liveCountEl.textContent) || 89;

        current += change;

        liveCountEl.textContent = current;
    }

    function updateMembers() {
        let members =
            Number(
                membersEl.textContent.replace(/,/g, "")
            ) || 1284;

        const change =
            Math.floor(Math.random() * 6) - 2;

        members += change;

        members = Math.max(
            1200,
            Math.min(1500, members)
        );

        membersEl.textContent =
            members.toLocaleString("en-US");
    }

    function init() {
        endTime = getEndTime();

        updateTimer();
        generateTicker();

        setInterval(updateTimer, 250);

        setInterval(
            generateTicker,
            14000
        );

        setInterval(
            updateLiveCount,
            5000 + Math.random() * 4000
        );

        setInterval(
            updateMembers,
            10000
        );

        document.addEventListener(
            "visibilitychange",
            function () {
                if (!document.hidden) {
                    updateTimer();
                }
            }
        );

        window.addEventListener(
            "pageshow",
            updateTimer
        );

        window.addEventListener(
            "focus",
            updateTimer
        );
    }

    init();

})();
</script>

</body>
</html>
