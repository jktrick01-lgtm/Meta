<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RΞD · Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --red: #ff003c;
      --red-mid: #cc0033;
      --red-soft: #ff4d6d;
      --bg: #0a0002;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* ── AMBIENT ORBS ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 560px; height: 560px;
      background: var(--red);
      top: -290px; right: -190px;
      opacity: 0.11;
      animation: float1 18s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 460px; height: 460px;
      background: var(--red-mid);
      bottom: -210px; left: -130px;
      opacity: 0.09;
      animation: float2 22s ease-in-out infinite alternate-reverse;
    }
    @keyframes float1 { to { transform: translate(70px, -50px) scale(1.4); } }
    @keyframes float2 { to { transform: translate(-60px, 40px) scale(1.35); } }

    /* ── CARD ── */
    .card {
      position: relative;
      z-index: 10;
      max-width: 430px;
      width: 100%;
      background: rgba(10, 0, 2, 0.68);
      backdrop-filter: blur(40px) saturate(1.5);
      -webkit-backdrop-filter: blur(40px) saturate(1.5);
      border-radius: 52px;
      padding: 32px 28px 36px;
      border: 1px solid rgba(255, 0, 60, 0.18);
      box-shadow:
        0 40px 120px rgba(0,0,0,0.88),
        0 0 0 1px rgba(255,0,60,0.04) inset;
      text-align: center;
      animation: borderBreath 3s infinite alternate;
    }
    @keyframes borderBreath {
      0%  { border-color: rgba(255,0,60,0.12); }
      100%{ border-color: rgba(255,0,60,0.38); }
    }

    /* ══════════════════════════════════════════
       TOP — TELEGRAM CHANNEL BANNER
    ══════════════════════════════════════════ */
    .tg-channel-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,0,60,0.07);
      border: 1px solid rgba(255,0,60,0.18);
      border-radius: 20px;
      padding: 10px 14px 10px 12px;
      margin-bottom: 24px;
      text-decoration: none;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
      cursor: pointer;
    }
    .tg-channel-banner:hover {
      background: rgba(255,0,60,0.13);
      border-color: rgba(255,0,60,0.35);
      transform: translateY(-1px);
    }
    .tg-channel-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tg-icon-wrap {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,0,60,0.14);
      border: 1px solid rgba(255,0,60,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .tg-icon-wrap svg {
      width: 18px; height: 18px;
      fill: var(--red-soft);
    }
    .tg-channel-text {
      text-align: left;
    }
    .tg-channel-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      display: block;
      margin-bottom: 2px;
    }
    .tg-channel-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .tg-channel-name em {
      font-style: normal;
      color: var(--red-soft);
    }
    .tg-join-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--red);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 30px;
      white-space: nowrap;
      box-shadow: 0 4px 18px rgba(255,0,60,0.35);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .tg-channel-banner:hover .tg-join-pill {
      background: #ff1a4a;
      box-shadow: 0 6px 24px rgba(255,0,60,0.5);
    }
    .tg-join-pill svg {
      width: 10px; height: 10px;
      fill: #fff;
      flex-shrink: 0;
    }

    /* ── LIVE BADGE ── */
    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,0,60,0.06);
      border: 1px solid rgba(255,0,60,0.10);
      padding: 5px 16px 5px 10px;
      border-radius: 40px;
      margin-bottom: 22px;
    }
    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 14px var(--red);
      animation: dotPulse 1.2s infinite;
    }
    @keyframes dotPulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.2; transform: scale(0.65); }
    }
    .badge-live-text {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }
    .badge-live-count {
      color: var(--red-soft);
      font-weight: 700;
      background: rgba(255,0,60,0.08);
      padding: 0 10px;
      border-radius: 20px;
    }

    /* ── HEADLINE ── */
    h1 {
      font-size: 2.7rem;
      font-weight: 800;
      letter-spacing: -0.032em;
      line-height: 1.04;
      color: #fff;
      margin-bottom: 5px;
    }
    h1 .red-text {
      background: linear-gradient(135deg, #ff4d6d 0%, #cc0033 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subhead {
      color: rgba(255,255,255,0.28);
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      margin-bottom: 30px;
    }

    /* ── TIMER ── */
    .timer-wrap {
      margin-bottom: 30px;
    }
    .timer-digits {
      font-size: 3.9rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #fff;
      line-height: 1;
      letter-spacing: 0.02em;
      margin-bottom: 12px;
      transition: color 0.4s;
    }
    .timer-digits.warn  { color: var(--red-soft); }
    .timer-digits.urgent{ color: var(--red); animation: textFlash 0.7s infinite; }
    @keyframes textFlash {
      0%,100% { opacity:1; text-shadow: 0 0 40px var(--red); }
      50%      { opacity:0.18; }
    }
    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--red), var(--red-soft));
      border-radius: 10px;
      box-shadow: 0 0 28px rgba(255,0,60,0.45);
      transition: width 0.45s cubic-bezier(0.25,0.46,0.45,0.94);
    }

    /* ── TICKER ── */
    .ticker-wrap {
      width: 100%;
      height: 28px;
      overflow: hidden;
      margin-bottom: 26px;
      background: rgba(255,0,60,0.025);
      border: 1px solid rgba(255,0,60,0.06);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ticker-scroll {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: tickerRoll 12s linear infinite;
    }
    @keyframes tickerRoll {
      0%  { transform: translateY(0); }
      100%{ transform: translateY(-50%); }
    }
    .ticker-item {
      height: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.32);
      font-size: 0.73rem;
      white-space: nowrap;
      padding: 0 14px;
    }
    .ticker-item strong { color: var(--red-soft); font-weight: 600; }
    .ticker-item .ago   { color: var(--red); font-size: 0.63rem; font-weight: 600; }

    /* ── MAIN CTA BUTTON ── */
    .cta-wrap {
      position: relative;
      margin-bottom: 0;
    }
    .cta-glow {
      position: absolute;
      inset: 0;
      border-radius: 40px;
      background: var(--red);
      filter: blur(38px);
      opacity: 0.11;
      z-index: 0;
      animation: glowBeat 2s infinite;
    }
    @keyframes glowBeat {
      0%,100%{ transform:scale(1); opacity:0.11; }
      50%    { transform:scale(1.07); opacity:0.26; }
    }
    .join-btn {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 18px 24px;
      background: var(--red);
      color: #fff;
      font-size: 1.08rem;
      font-weight: 700;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.01em;
      box-shadow: 0 8px 40px rgba(255,0,60,0.3);
      transition: all 0.28s cubic-bezier(0.34,1.56,0.64,1);
      overflow: hidden;
    }
    .join-btn::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 42px;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
      opacity: 0;
      transition: opacity 0.28s;
    }
    .join-btn:hover::before { opacity: 1; }
    .join-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 56px rgba(255,0,60,0.52);
      background: #ff1a4a;
    }
    .join-btn:active { transform: scale(0.96); }
    .arrow {
      font-size: 1.25rem;
      transition: transform 0.28s ease;
    }
    .join-btn:hover .arrow { transform: translateX(6px) rotate(-10deg); }

    /* disabled state */
    .join-btn.expired {
      opacity: 0.35;
      pointer-events: none;
      background: #444;
      box-shadow: none;
    }

    /* ── FOOTER ── */
    .footer-meta {
      display: flex;
      justify-content: center;
      gap: 26px;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,0,60,0.07);
    }
    .footer-meta span {
      color: rgba(255,255,255,0.14);
      font-size: 0.59rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .footer-meta b { color: rgba(255,255,255,0.28); font-weight: 700; }

    /* ── RESPONSIVE ── */
    @media (max-width: 440px) {
      .card { padding: 24px 16px 28px; border-radius: 38px; }
      h1 { font-size: 2.2rem; }
      .timer-digits { font-size: 3.2rem; }
      .join-btn { font-size: 1rem; padding: 16px 18px; }
      .tg-channel-banner { padding: 8px 10px 8px 10px; border-radius: 16px; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">

    <!-- ══ TELEGRAM CHANNEL BANNER (TOP) ══ -->
    <a class="tg-channel-banner" href="https://t.me/+fB39naJwgfEzOWU1" target="_blank" rel="noopener noreferrer" id="channelBanner">
      <div class="tg-channel-left">
        <div class="tg-icon-wrap">
          <!-- Telegram plane icon -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.265 2.428a1.5 1.5 0 0 0-1.528-.228L2.178 9.407a1.5 1.5 0 0 0 .153 2.836l4.342 1.302 2.025 6.27a1.5 1.5 0 0 0 2.573.461l2.61-3.135 4.85 3.564a1.5 1.5 0 0 0 2.353-1.001l2.25-15a1.5 1.5 0 0 0-.069-.276zM16.9 7.21l-7.25 6.676-3.6-1.08L16.9 7.21zm-4.56 9.78-.978-3.034 1.427-1.314 1.762 1.295-2.211 3.053zm5.338.49-5.13-3.77 8.048-7.407-2.918 11.177z"/>
          </svg>
        </div>
        <div class="tg-channel-text">
          <span class="tg-channel-label">Official Channel</span>
          <span class="tg-channel-name"><em>RΞD</em> Access · Telegram</span>
        </div>
      </div>
      <div class="tg-join-pill">
        Join
        <svg viewBox="0 0 10 10"><path d="M1 5h8M6 2l3 3-3 3" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </a>

    <!-- ── LIVE BADGE ── -->
    <div class="badge-live">
      <span class="live-dot"></span>
      <span class="badge-live-text">Live</span>
      <span class="badge-live-count" id="liveCount">89</span>
      <span class="badge-live-text">joined</span>
    </div>

    <!-- ── HEADLINE ── -->
    <h1><span class="red-text">RΞD</span> Access</h1>
    <p class="subhead">Invite‑only · 24h window</p>

    <!-- ── TIMER ── -->
    <div class="timer-wrap">
      <div class="timer-digits" id="timerDigits">10:00</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- ── TICKER ── -->
    <div class="ticker-wrap">
      <div class="ticker-scroll" id="tickerScroll"></div>
    </div>

    <!-- ── MAIN CTA ── -->
    <div class="cta-wrap">
      <div class="cta-glow"></div>
      <a class="join-btn" href="https://t.me/+fB39naJwgfEzOWU1" id="joinBtn" target="_blank" rel="noopener noreferrer">
        <span>Enter Telegram</span>
        <span class="arrow">⟶</span>
      </a>
    </div>

    <!-- ── FOOTER ── -->
    <div class="footer-meta">
      <span>🔒 <b>256</b>‑bit</span>
      <span>⚡ <b>0%</b> latency</span>
      <span>📱 Android &amp; iOS</span>
    </div>

  </div>

  <script>
  (function () {
    'use strict';

    const TELEGRAM_URL   = 'https://t.me/+fB39naJwgfEzOWU1';
    const TOTAL_SECONDS  = 600;
    const STORAGE_KEY    = 'red_access_timer_v2';

    const timerEl   = document.getElementById('timerDigits');
    const fillEl    = document.getElementById('progressFill');
    const joinBtn   = document.getElementById('joinBtn');
    const liveEl    = document.getElementById('liveCount');
    const tickerEl  = document.getElementById('tickerScroll');

    let remaining  = TOTAL_SECONDS;
    let ticker_iv  = null;
    let expired    = false;

    /* ── TIMER ── */
    function fmt(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    }

    function renderTimer() {
      timerEl.textContent = fmt(remaining);
      timerEl.classList.remove('warn','urgent');
      if      (remaining <= 60)  timerEl.classList.add('urgent');
      else if (remaining <= 180) timerEl.classList.add('warn');

      const pct = ((TOTAL_SECONDS - remaining) / TOTAL_SECONDS) * 100;
      fillEl.style.width = Math.min(100, pct) + '%';
    }

    function expire() {
      if (expired) return;
      expired = true;
      timerEl.textContent = '00:00';
      timerEl.classList.add('urgent');
      fillEl.style.width = '100%';
      joinBtn.classList.add('expired');
      joinBtn.innerHTML = '<span>⌛ Session Expired</span>';
      joinBtn.removeAttribute('href');
      document.getElementById('channelBanner').style.pointerEvents = 'none';
      document.getElementById('channelBanner').style.opacity = '0.4';
      try { localStorage.removeItem(STORAGE_KEY); } catch(_) {}
    }

    function tick() {
      if (remaining <= 0) { expire(); return; }
      remaining--;
      renderTimer();
      if (remaining % 5 === 0) {
        try { localStorage.setItem(STORAGE_KEY, String(remaining)); } catch(_) {}
      }
    }

    function loadState() {
      try {
        const v = localStorage.getItem(STORAGE_KEY);
        if (v) {
          const n = parseInt(v, 10);
          if (!isNaN(n) && n > 0 && n <= TOTAL_SECONDS) {
            remaining = n; return true;
          }
        }
      } catch(_) {}
      return false;
    }

    /* ── TICKER ── */
    const NAMES = [
      '0x_red','crimson_byte','neon_ghost','shadow_ops','volt_agent',
      'inferno_core','cyber_pulse','red_queen','delta_fire','omega_rx',
      'phoenix_zk','rage_frame','synth_wave','void_runner','blaze_hash',
      'null_ptr','h4wk_eye','exec_root','d4rk_node','echo_flux'
    ];

    function buildTicker() {
      let html = '';
      for (let rep = 0; rep < 2; rep++) {
        for (let i = 0; i < 18; i++) {
          const name = NAMES[Math.floor(Math.random() * NAMES.length)];
          const m = Math.floor(Math.random() * 14) + 1;
          const s = Math.floor(Math.random() * 59) + 1;
          html += `<div class="ticker-item">
            <strong>${name}</strong> joined ·
            <span class="ago">${m}m ${s}s ago</span>
          </div>`;
        }
      }
      tickerEl.innerHTML = html;
    }

    function resetTickerAnimation() {
      tickerEl.style.animation = 'none';
      void tickerEl.offsetWidth;
      tickerEl.style.animation = 'tickerRoll 12s linear infinite';
    }

    /* ── LIVE COUNT ── */
    let liveCount = 89;
    function bumpLive() {
      liveCount += Math.floor(Math.random() * 3) + 1;
      liveEl.textContent = liveCount;
    }

    /* ── INIT ── */
    function init() {
      if (!loadState()) {
        remaining = TOTAL_SECONDS;
        try { localStorage.setItem(STORAGE_KEY, String(remaining)); } catch(_) {}
      }

      if (remaining <= 0) {
        remaining = 0;
        renderTimer();
        expire();
        return;
      }

      renderTimer();
      setInterval(tick, 1000);

      buildTicker();
      setInterval(() => {
        buildTicker();
        resetTickerAnimation();
      }, 14000);

      setInterval(bumpLive, 4500 + Math.random() * 3500);
    }

    init();
  })();
  </script>
</body>
</html>
