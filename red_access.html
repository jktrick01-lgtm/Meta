<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0002" />
    <meta name="description" content="RΞD Access — Invite-only Telegram community. Limited 24-hour window." />
    <title>RΞD · Exclusive Access</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
               CSS CUSTOM PROPERTIES — Design Tokens
               ============================================================ */
        :root {
            /* Core colors */
            --bg-primary: #0a0002;
            --bg-card: rgba(10, 0, 2, 0.72);
            --accent-primary: #ff003c;
            --accent-secondary: #ff4d6d;
            --accent-tertiary: #cc0033;
            --accent-glow: rgba(255, 0, 60, 0.35);
            --accent-glow-strong: rgba(255, 0, 60, 0.6);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-muted: rgba(255, 255, 255, 0.3);
            --text-faint: rgba(255, 255, 255, 0.12);
            --border-subtle: rgba(255, 0, 60, 0.08);
            --border-medium: rgba(255, 0, 60, 0.18);
            --border-active: rgba(255, 0, 60, 0.4);

            /* Typography */
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 40px;
            --space-3xl: 48px;

            /* Border radius */
            --radius-sm: 12px;
            --radius-md: 24px;
            --radius-lg: 40px;
            --radius-xl: 56px;

            /* Transitions */
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-smooth: 0.8s cubic-bezier(0.65, 0, 0.35, 1);

            /* Shadows */
            --shadow-card: 0 40px 120px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 0, 60, 0.06) inset;
            --shadow-btn: 0 8px 40px rgba(255, 0, 60, 0.3);
            --shadow-btn-hover: 0 14px 56px rgba(255, 0, 60, 0.5);

            /* Z-index layers */
            --z-background: 0;
            --z-card: 10;
            --z-overlay: 20;
        }

        /* ============================================================
               RESET & BASE STYLES
               ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg);
            overflow: hidden;
            position: relative;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================================
               AMBIENT BACKGROUND ORBS — Animated Neon Spheres
               ============================================================ */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: var(--z-background);
            will-change: transform, opacity;
        }

        .glow-orb--top-right {
            width: 550px;
            height: 550px;
            background: var(--accent-primary);
            top: -280px;
            right: -180px;
            opacity: 0.12;
            animation: orbFloatTop 18s ease-in-out infinite alternate;
        }

        .glow-orb--bottom-left {
            width: 450px;
            height: 450px;
            background: var(--accent-tertiary);
            bottom: -220px;
            left: -140px;
            opacity: 0.1;
            animation: orbFloatBottom 22s ease-in-out infinite alternate-reverse;
        }

        .glow-orb--center {
            width: 300px;
            height: 300px;
            background: var(--accent-secondary);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.04;
            animation: orbPulse 8s ease-in-out infinite;
        }

        @keyframes orbFloatTop {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(70px, -50px) scale(1.4);
            }
        }

        @keyframes orbFloatBottom {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(-60px, 40px) scale(1.35);
            }
        }

        @keyframes orbPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.04;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 0.08;
            }
        }

        /* ============================================================
               MAIN CARD — Glassmorphism Container
               ============================================================ */
        .access-card {
            position: relative;
            z-index: var(--z-card);
            max-width: 440px;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(40px) saturate(1.5);
            -webkit-backdrop-filter: blur(40px) saturate(1.5);
            border-radius: var(--radius-xl);
            padding: 44px 28px 36px;
            border: 1px solid var(--border-medium);
            box-shadow: var(--shadow-card);
            text-align: center;
            transition: transform var(--transition-spring), border-color 1.5s ease, box-shadow 1.5s ease;
            animation: cardBorderPulse 3s infinite alternate;
            will-change: transform;
        }

        .access-card:hover {
            transform: scale(1.006);
            box-shadow: var(--shadow-card), 0 0 80px rgba(255, 0, 60, 0.08);
        }

        @keyframes cardBorderPulse {
            0% {
                border-color: rgba(255, 0, 60, 0.12);
            }
            100% {
                border-color: rgba(255, 0, 60, 0.35);
            }
        }

        /* ============================================================
               LIVE BADGE — Terminal Style Indicator
               ============================================================ */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 0, 60, 0.07);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px 18px 6px 12px;
            border-radius: 40px;
            border: 1px solid var(--border-subtle);
            margin-bottom: var(--space-lg);
            transition: border-color var(--transition-base), background var(--transition-base);
        }

        .live-badge:hover {
            border-color: var(--border-medium);
            background: rgba(255, 0, 60, 0.1);
        }

        .live-badge__dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-primary);
            box-shadow: 0 0 16px var(--accent-primary);
            animation: dotPulse 1.2s infinite;
            flex-shrink: 0;
        }

        @keyframes dotPulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.25;
                transform: scale(0.7);
            }
        }

        .live-badge__label {
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .live-badge__count {
            color: var(--accent-secondary);
            font-weight: 700;
            font-size: 0.75rem;
            background: rgba(255, 0, 60, 0.1);
            padding: 2px 12px;
            border-radius: 20px;
            letter-spacing: 0.02em;
            min-width: 36px;
            text-align: center;
            transition: background var(--transition-fast);
        }

        /* ============================================================
               HEADLINE & SUBTITLE
               ============================================================ */
        .access-card__title {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.035em;
            line-height: 1.05;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .access-card__title-gradient {
            background: linear-gradient(135deg, #ff4d6d 0%, #cc0033 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255, 0, 60, 0.2);
        }

        .access-card__subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 400;
            margin-bottom: var(--space-xl);
            letter-spacing: 0.04em;
        }

        /* ============================================================
               COUNTDOWN TIMER — Neon Digital Display
               ============================================================ */
        .timer-section {
            margin-bottom: var(--space-xl);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .timer-display {
            font-size: 3.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
            letter-spacing: 0.02em;
            line-height: 1;
            margin-bottom: 12px;
            text-shadow: 0 0 30px rgba(255, 0, 60, 0.1);
            transition: color 0.4s ease, text-shadow 0.4s ease;
            will-change: color, text-shadow;
        }

        .timer-display--warning {
            color: var(--accent-secondary);
            text-shadow: 0 0 30px rgba(255, 77, 109, 0.3);
        }

        .timer-display--urgent {
            color: var(--accent-primary);
            text-shadow: 0 0 40px rgba(255, 0, 60, 0.5);
            animation: timerUrgentPulse 0.7s infinite;
        }

        @keyframes timerUrgentPulse {
            0%,
            100% {
                opacity: 1;
                text-shadow: 0 0 40px var(--accent-glow-strong);
            }
            50% {
                opacity: 0.3;
                text-shadow: 0 0 0px var(--accent-primary);
            }
        }

        .timer-progress {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 4px;
            position: relative;
        }

        .timer-progress__fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff003c, #ff4d6d);
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.4);
            will-change: width;
        }

        /* ============================================================
               FOMO TICKER — Live Activity Feed
               ============================================================ */
        .ticker {
            width: 100%;
            height: 28px;
            overflow: hidden;
            margin-bottom: var(--space-lg);
            background: rgba(255, 0, 60, 0.03);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid var(--border-subtle);
            transition: border-color var(--transition-base);
        }

        .ticker:hover {
            border-color: var(--border-medium);
        }

        .ticker__scroll {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: tickerScrollVertical 12s linear infinite;
            will-change: transform;
        }

        .ticker__item {
            height: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 400;
            white-space: nowrap;
            padding: 0 12px;
        }

        .ticker__username {
            color: var(--accent-secondary);
            font-weight: 600;
        }

        .ticker__time {
            color: var(--accent-primary);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        @keyframes tickerScrollVertical {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-100%);
            }
        }

        /* ============================================================
               TELEGRAM PREVIEW CARD — Channel Info
               ============================================================ */
        .telegram-preview {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: rgba(255, 0, 60, 0.04);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            margin-bottom: var(--space-lg);
            transition: border-color var(--transition-base), background var(--transition-base);
            text-align: left;
            cursor: pointer;
            text-decoration: none;
        }

        .telegram-preview:hover {
            border-color: var(--border-medium);
            background: rgba(255, 0, 60, 0.07);
        }

        .telegram-preview__icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a7feb 0%, #0b5fbb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 16px rgba(26, 127, 235, 0.3);
        }

        .telegram-preview__info {
            flex: 1;
            min-width: 0;
        }

        .telegram-preview__name {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            margin-bottom: 2px;
        }

        .telegram-preview__meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        .telegram-preview__arrow {
            color: var(--text-faint);
            font-size: 1.2rem;
            transition: color var(--transition-fast), transform var(--transition-fast);
            flex-shrink: 0;
        }

        .telegram-preview:hover .telegram-preview__arrow {
            color: var(--accent-primary);
            transform: translateX(4px);
        }

        /* ============================================================
               JOIN BUTTON — Magnetic Red CTA
               ============================================================ */
        .btn-wrapper {
            position: relative;
            z-index: 1;
            margin-bottom: var(--space-sm);
        }

        .btn-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: var(--radius-lg);
            background: var(--accent-primary);
            filter: blur(40px);
            opacity: 0.1;
            z-index: -1;
            animation: btnGlowPulse 2s infinite;
            will-change: transform, opacity;
        }

        @keyframes btnGlowPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.1;
            }
            50% {
                transform: scale(1.06);
                opacity: 0.25;
            }
        }

        .join-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            padding: 18px 24px;
            background: var(--accent-primary);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-lg);
            cursor: pointer;
            text-decoration: none;
            transition: all var(--transition-spring);
            box-shadow: var(--shadow-btn);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.01em;
            will-change: transform, box-shadow, background;
        }

        .join-btn::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 42px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
            opacity: 0;
            transition: opacity var(--transition-base);
            pointer-events: none;
        }

        .join-btn:hover::after {
            opacity: 1;
        }

        .join-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--shadow-btn-hover);
            background: #ff1a4a;
        }

        .join-btn:active {
            transform: scale(0.96);
            box-shadow: 0 4px 20px rgba(255, 0, 60, 0.3);
        }

        .join-btn__arrow {
            transition: transform var(--transition-base);
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .join-btn:hover .join-btn__arrow {
            transform: translateX(6px) rotate(-10deg);
        }

        .join-btn--disabled {
            opacity: 0.4;
            pointer-events: none;
            box-shadow: none;
        }

        .join-btn--disabled .join-btn__arrow {
            transform: none;
        }

        /* ============================================================
               FOOTER META — Technical Specs
               ============================================================ */
        .footer-meta {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: var(--space-lg);
            padding-top: 20px;
            border-top: 1px solid var(--border-subtle);
            flex-wrap: wrap;
        }

        .footer-meta__item {
            color: var(--text-faint);
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color var(--transition-fast);
        }

        .footer-meta__item:hover {
            color: var(--text-muted);
        }

        .footer-meta__value {
            color: var(--text-muted);
            font-weight: 700;
        }

        /* ============================================================
               RESPONSIVE BREAKPOINTS
               ============================================================ */
        @media (max-width: 440px) {
            .access-card {
                padding: 32px 18px 28px;
                border-radius: 40px;
            }

            .access-card__title {
                font-size: 2.2rem;
            }

            .timer-display {
                font-size: 3rem;
            }

            .join-btn {
                font-size: 1rem;
                padding: 16px 20px;
            }

            .telegram-preview {
                padding: 12px 14px;
            }

            .footer-meta {
                gap: 16px;
            }
        }

        @media (max-width: 360px) {
            .access-card {
                padding: 24px 14px 22px;
                border-radius: 32px;
            }

            .access-card__title {
                font-size: 1.9rem;
            }

            .timer-display {
                font-size: 2.4rem;
            }

            .live-badge {
                padding: 4px 12px 4px 8px;
                gap: 6px;
            }

            .live-badge__label {
                font-size: 0.6rem;
            }
        }

        /* ============================================================
               REDUCED MOTION PREFERENCE
               ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

           DOM REFERENCES
           ============================================================ */
        const timerDisplay = document.getElementById('timerDisplay');
        const progressFill = document.getElementById('progressFill');
        const joinBtn = document.getElementById('joinBtn');
        const liveCountEl = document.getElementById('liveCountDisplay');
        const tickerScroll = document.getElementById('tickerScroll');
        const channelMemberCountEl = document.getElementById('channelMemberCount');

        /* ============================================================
           STATE MANAGEMENT
           ============================================================ */
        let remainingSeconds = CONFIG.INITIAL_SECONDS;
        let timerIntervalId = null;
        let isExpired = false;
        let liveCount = 89;
        let channelMembers = 1284;

        /* ============================================================
           TIMER FUNCTIONS
           ============================================================ */
        /**
         * Format seconds into MM:SS display string
         * @param {number} seconds - Total seconds remaining
         * @returns {string} Formatted time string
         */
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        /**
         * Update all timer-related UI elements
         */
        function updateTimerUI() {
            timerDisplay.textContent = formatTime(remainingSeconds);
            timerDisplay.classList.remove('timer-display--warning', 'timer-display--urgent');

            if (remainingSeconds <= 60) {
                timerDisplay.classList.add('timer-display--urgent');
            } else if (remainingSeconds <= 180) {
                timerDisplay.classList.add('timer-display--warning');
            }

            const elapsed = CONFIG.INITIAL_SECONDS - remainingSeconds;
            const percentage = Math.min(100, (elapsed / CONFIG.INITIAL_SECONDS) * 100);
            progressFill.style.width = percentage + '%';

            if (remainingSeconds <= 0 && !isExpired) {
                handleTimerExpiry();
            }
        }

        /**
         * Handle timer expiration
         */
        function handleTimerExpiry() {
            if (isExpired) return;
            isExpired = true;
            clearInterval(timerIntervalId);
            timerIntervalId = null;

            timerDisplay.textContent = '00:00';
            timerDisplay.classList.add('timer-display--urgent');
            progressFill.style.width = '100%';

            joinBtn.classList.add('join-btn--disabled');
            joinBtn.innerHTML = '<span>⌛ Session Expired</span><span class="join-btn__arrow" aria-hidden="true">✕</span>';
            joinBtn.href = '#';
            joinBtn.removeAttribute('target');
            joinBtn.removeAttribute('rel');
            joinBtn.setAttribute('aria-disabled', 'true');

            // Clear stored timer state
            try {
                localStorage.removeItem(CONFIG.STORAGE_KEY);
            } catch (_) {
                /* Storage might be unavailable */
            }
        }

        /**
         * Tick the timer by one second
         */
        function tickTimer() {
            if (remainingSeconds <= 0) {
                handleTimerExpiry();
                return;
            }
            remainingSeconds -= 1;
            updateTimerUI();

            // Persist state every 5 seconds to reduce storage writes
            if (remainingSeconds % 5 === 0) {
                saveTimerState();
            }
        }

        /**
         * Start the countdown interval
         */
        function startTimer() {
            if (timerIntervalId) clearInterval(timerIntervalId);
            timerIntervalId = setInterval(tickTimer, 1000);
        }

        /**
         * Save timer state to localStorage
         */
        function saveTimerState() {
            try {
                localStorage.setItem(CONFIG.STORAGE_KEY, String(remainingSeconds));
            } catch (_) {
                /* Storage might be full or unavailable */
            }
        }

        /**
         * Load timer state from localStorage
         * @returns {boolean} True if valid state was loaded
         */
        function loadTimerState() {
            try {
                const stored = localStorage.getItem(CONFIG.STORAGE_KEY);
                if (stored !== null) {
                    const parsed = parseInt(stored, 10);
                    if (!isNaN(parsed) && parsed > 0 && parsed <= CONFIG.INITIAL_SECONDS) {
                        remainingSeconds = parsed;
                        return true;
                    }
                }
            } catch (_) {
                /* Storage might be unavailable */
            }
            return false;
        }

        /* ============================================================
           TICKER FUNCTIONS — FOMO Activity Feed
           ============================================================ */
        /**
         * Generate random ticker items
         * @returns {Array<{name: string, time: string}>} Array of ticker entries
         */
        function generateTickerItems() {
            const items = [];
            for (let i = 0; i < CONFIG.TICKER_ITEM_COUNT; i++) {
                const name = FAKE_USERNAMES[Math.floor(Math.random() * FAKE_USERNAMES.length)];
                const minutes = Math.floor(Math.random() * 12) + 1;
                const seconds = Math.floor(Math.random() * 60);
                items.push({
                    name: name,
                    time: `${minutes}m ${seconds}s ago`
                });
            }
            return items;
        }

        /**
         * Render ticker items into the DOM
         * Items are duplicated for seamless infinite scroll
         */
        function renderTicker() {
            const items = generateTickerItems();
            let html = '';
            // Duplicate for seamless loop
            for (let rep = 0; rep < 2; rep++) {
                for (const item of items) {
                    html += `
                    <div class="ticker__item">
                        <span class="ticker__username">${item.name}</span>
                        joined ·
                        <span class="ticker__time">${item.time}</span>
                    </div>`;
                }
            }
            tickerScroll.innerHTML = html;
        }

        /**
         * Restart ticker animation for seamless looping
         */
        function restartTickerAnimation() {
            tickerScroll.style.animation = 'none';
            // Force reflow
            void tickerScroll.offsetHeight;
            tickerScroll.style.animation = 'tickerScrollVertical 12s linear infinite';
        }

        /* ============================================================
           LIVE COUNT FUNCTIONS — Simulated Active Users
           ============================================================ */
        /**
         * Update the live user count with a random increment
         */
        function updateLiveCount() {
            const increment = Math.floor(Math.random() * 3) + 1;
            liveCount += increment;
            liveCountEl.textContent = liveCount;
        }

        /**
         * Update channel member count with subtle fluctuation
         */
        function updateChannelMembers() {
            // Small fluctuation between -2 and +3
            const change = Math.floor(Math.random() * 6) - 2;
            channelMembers += change;
            if (channelMembers < 1200) channelMembers = 1200;
            if (channelMembers > 1500) channelMembers = 1500;
            channelMemberCountEl.textContent = channelMembers.toLocaleString('en-US');
        }

        /* ============================================================
           INITIALIZATION
           ============================================================ */
        /**
         * Initialize the entire application
         */
        function init() {
            // Load timer state
            const hasStoredState = loadTimerState();
            if (!hasStoredState) {
                remainingSeconds = CONFIG.INITIAL_SECONDS;
                saveTimerState();
            }

            // Handle already-expired state
            if (remainingSeconds <= 0) {
                remainingSeconds = 0;
                updateTimerUI();
                handleTimerExpiry();
            } else {
                updateTimerUI();
                startTimer();
            }

            // Render initial ticker
            renderTicker();

            // Refresh ticker periodically
            setInterval(() => {
                renderTicker();
                restartTickerAnimation();
            }, CONFIG.TICKER_REFRESH_MS);

            // Update live count periodically
            setInterval(updateLiveCount, CONFIG.LIVE_COUNT_MIN_MS + Math.random() * CONFIG.LIVE_COUNT_MAX_MS);

            // Update channel members periodically
            setInterval(updateChannelMembers, 10000);

            // Safety check: ensure expiry is handled
            setInterval(() => {
                if (remainingSeconds <= 0 && !isExpired) {
                    handleTimerExpiry();
                }
            }, 2000);

            // Handle page visibility changes to keep timer accurate
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && !isExpired) {
                    // Timer keeps running via setInterval; just ensure UI is synced
                    updateTimerUI();
                }
            });

            // Handle online/offline to pause/resume gracefully
            window.addEventListener('online', () => {
                if (!isExpired && !timerIntervalId) {
                    startTimer();
                    updateTimerUI();
                }
            });

            window.addEventListener('offline', () => {
                if (timerIntervalId) {
                    clearInterval(timerIntervalId);
                    timerIntervalId = null;
                }
            });
        }

        // Boot the application
        init();

    })();
</script>
</body>
</html>
